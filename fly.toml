# fly.toml app configuration file generated for raio-x-motor on 2026-09-03T20:55:06-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'raio-x-motor'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  # A loja de desenvolvimento do próprio Bruno (Shopify Partners), pra medir
  # a Camada 2 (carrinho/checkout/pagamento) sem depender de aceite de
  # terceiro. Sem problema de privacidade estar aqui, versionada: é o dono
  # do projeto autorizando a própria loja. Ver lojaPropriaDoAmbiente em
  # apps/worker/scripts/medir-cobertura.ts.
  RAIO_X_LOJA_PROPRIA = 'https://raioxreborn.myshopify.com'
  RAIO_X_JANELA_POR_IP_MINUTOS = '10'
  RAIO_X_MAX_SIMULTANEAS = '3'
  RAIO_X_ORIGENS = 'https://calculadora-iota-pearl.vercel.app'
  RAIO_X_TETO_POR_IP = '5'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
